name: Deploy to Cloudflare Pages

on:
  push:
    branches: [prod]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build:production

      # Run wrangler directly (not wrangler-action) so deploy errors are visible
      # in the Actions log. Production branch in Cloudflare must be "prod".
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=attheviewbox --commit-dirty=true
